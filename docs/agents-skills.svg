<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">How AGENTS.md and skills reach the model</title><desc id="desc">trace/memory.ts loads AGENTS.md from the working directory in two steps and inlines it into the system prompt. trace/skills.ts lists skills in the system prompt and offers the use_skill tool; a skill's full SKILL.md arrives as a tool result.</desc><metadata id="illustration-style">{"canvas": {"height": 800, "width": 1200}, "fonts": {"display": "Georgia", "labels": "Arial"}, "profile": "plum-apricot", "profile_sha256": "c9eaf17798100dfaf4123094d3d3b1e35a319ef81105a348288f919b4d91d8e6", "profile_version": "1.2", "style_version": 1, "theme": "light"}</metadata><defs><style id="brand-style">text { font-family: 'Arial'; font-size: 24px; fill: #231B21; }
.title { font-family: 'Georgia'; font-size: 40px; font-weight: 400; }
.label { font-size: 24px; }
.small { font-size: 20px; fill: #54494F; }
.note { font-size: 21px; }
.section { font-size: 24px; font-weight: 600; fill: #4A2446; }
.node { fill: #FFFFFF; stroke: #665B61; stroke-width: 2; }
.focus { fill: #F1E3EF; stroke: #4A2446; stroke-width: 2.5; }
.highlight { fill: #F2A97A; stroke: #4A2446; stroke-width: 2.5; }
.panel { fill: #4A2446; stroke: #4A2446; stroke-width: 2; }
.on-panel { fill: #FFFFFF; }
.on-highlight { fill: #231B21; }
.badge { fill: #4A2446; }
.number { font-size: 19px; fill: #FFFFFF; }
.arrow { fill: none; stroke: #665B61; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrowhead); }
.leader { fill: none; stroke: #665B61; stroke-width: 2; stroke-dasharray: 6 5; }
.line { fill: none; stroke: #665B61; stroke-width: 2; }
.watermark { font-size: 12px; fill: #54494F; }</style><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#665B61" /></marker></defs><rect id="background" x="0" y="0" width="1200" height="800" fill="#F8F4EF" /><g id="artwork">
  <g id="heading">
    <text x="40" y="60" class="title">How AGENTS.md and skills reach the model</text>
    <text x="40" y="96" class="small">AGENTS.md is copied into the system prompt whole. A skill is only listed there; its full text arrives through a tool call.</text>
  </g>

  <g id="agents-md">
    <rect x="40" y="120" width="360" height="330" rx="12" class="node" />
    <rect x="40" y="120" width="360" height="44" rx="12" class="panel" />
    <text x="56" y="150" class="label on-panel">AGENTS.md &#183; two steps</text>
    <text x="56" y="194" class="small">memory.ts &#183; working directory only</text>

    <g id="agents-step-1">
      <rect x="56" y="212" width="328" height="104" rx="12" class="focus" />
      <circle cx="84" cy="241" r="12" class="badge" />
      <text x="84" y="248" class="number" text-anchor="middle">1</text>
      <text x="106" y="249" class="label">Look up</text>
      <text x="72" y="279" class="small">existsSync(workdir/AGENTS.md)</text>
      <text x="72" y="303" class="small">no walk up parent folders</text>
    </g>

    <g id="agents-step-2">
      <rect x="56" y="328" width="328" height="104" rx="12" class="focus" />
      <circle cx="84" cy="357" r="12" class="badge" />
      <text x="84" y="364" class="number" text-anchor="middle">2</text>
      <text x="106" y="365" class="label">Inline</text>
      <text x="72" y="395" class="small">readFileSync, then pushed as</text>
      <text x="72" y="419" class="small">the Project instructions part</text>
    </g>
  </g>

  <g id="system-prompt">
    <rect x="440" y="120" width="320" height="330" rx="12" class="node" />
    <rect x="440" y="120" width="320" height="44" rx="12" class="panel" />
    <text x="456" y="150" class="label on-panel">buildSystemPrompt()</text>
    <text x="456" y="194" class="small">in order, sent on every call</text>

    <rect x="456" y="212" width="288" height="40" rx="10" class="node" />
    <text x="472" y="240" class="small">Base prompt</text>
    <rect x="456" y="258" width="288" height="40" rx="10" class="node" />
    <text x="472" y="286" class="small">Platform + workdir</text>
    <rect x="456" y="304" width="288" height="40" rx="10" class="highlight" />
    <text x="472" y="332" class="small on-highlight">Instructions (AGENTS.md)</text>
    <rect x="456" y="350" width="288" height="40" rx="10" class="focus" />
    <text x="472" y="378" class="small">Project memory (TRACE.md)</text>
    <rect x="456" y="396" width="288" height="40" rx="10" class="focus" />
    <text x="472" y="424" class="small">Skills available (catalog)</text>
  </g>

  <g id="skills">
    <rect x="800" y="120" width="360" height="330" rx="12" class="node" />
    <rect x="800" y="120" width="360" height="44" rx="12" class="panel" />
    <text x="816" y="150" class="label on-panel">Skills &#183; two ways in</text>
    <text x="816" y="194" class="small">skills.ts &#183; skills/&lt;name&gt;/SKILL.md</text>

    <g id="skills-catalog">
      <rect x="816" y="212" width="328" height="104" rx="12" class="focus" />
      <circle cx="844" cy="241" r="12" class="badge" />
      <text x="844" y="248" class="number" text-anchor="middle">A</text>
      <text x="866" y="249" class="label">Catalog</text>
      <text x="832" y="279" class="small">catalogPrompt(): one line</text>
      <text x="832" y="303" class="small">per skill, name: description</text>
    </g>

    <g id="skills-tool">
      <rect x="816" y="328" width="328" height="104" rx="12" class="focus" />
      <circle cx="844" cy="357" r="12" class="badge" />
      <text x="844" y="364" class="number" text-anchor="middle">B</text>
      <text x="866" y="365" class="label">use_skill tool</text>
      <text x="832" y="395" class="small">useSkillTool(workdir) spec,</text>
      <text x="832" y="419" class="small">sent in every request's tools</text>
    </g>
  </g>

  <g id="into-prompt">
    <path d="M384 380 H412 V324 H454" class="arrow" />
    <path d="M816 264 H788 V416 H746" class="arrow" />
  </g>

  <g id="tool-call">
    <text x="40" y="500" class="section">Skills ride on tool calling: the body arrives as a tool result</text>

    <rect x="40" y="522" width="208" height="96" rx="12" class="node" />
    <text x="56" y="552" class="label">Request</text>
    <text x="56" y="580" class="small">system prompt,</text>
    <text x="56" y="604" class="small">messages, tools</text>

    <rect x="268" y="522" width="208" height="96" rx="12" class="node" />
    <text x="284" y="552" class="label">Model turn</text>
    <text x="284" y="580" class="small">sees a listed skill,</text>
    <text x="284" y="604" class="small">calls use_skill</text>

    <rect x="496" y="522" width="208" height="96" rx="12" class="node" />
    <text x="512" y="552" class="label">execute()</text>
    <text x="512" y="580" class="small">Policy check,</text>
    <text x="512" y="604" class="small">then tool.run()</text>

    <rect x="724" y="522" width="208" height="96" rx="12" class="highlight" />
    <text x="740" y="552" class="label on-highlight">readSkill()</text>
    <text x="740" y="580" class="small on-highlight">looked up by</text>
    <text x="740" y="604" class="small on-highlight">name, not path</text>

    <rect x="952" y="522" width="208" height="96" rx="12" class="node" />
    <text x="968" y="552" class="label">Tool result</text>
    <text x="968" y="580" class="small">full SKILL.md</text>
    <text x="968" y="604" class="small">added to messages</text>

    <path d="M248 570 H266" class="arrow" />
    <path d="M476 570 H494" class="arrow" />
    <path d="M704 570 H722" class="arrow" />
    <path d="M932 570 H950" class="arrow" />
    <path d="M1056 618 V650 H144 V620" class="arrow" />
    <text x="600" y="678" class="small" text-anchor="middle">next turn: the model reads SKILL.md and follows it</text>

    <text x="40" y="716" class="small">Unknown name: the result is "ERROR: no skill named X. Available: ..." so the model can retry.</text>
    <text x="40" y="748" class="small">AGENTS.md is sent on every call and never compacted. A loaded skill is a message, so compaction can summarize it.</text>
  </g>
</g><g id="watermark"><text x="1176" y="776" class="watermark" text-anchor="end">Dipesh Walia</text></g></svg>
