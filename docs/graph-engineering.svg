<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Where Trace sits: from model to system intelligence</title><desc id="desc">Three levels from the Awesome-Graph-Engineering survey. Model intelligence: the model call, prompt, and context, all built in Trace. Individual intelligence: tools, memory, skills, runtime, loop, and feedback, where Trace is the harness and the loop gate is next. System intelligence, graph engineering: tasks, agents, state, evolution, and ontology organized as an explicit graph, where Trace has spawn_agent, runFleet, and sessions and the rest is next.</desc><metadata id="illustration-style">{"canvas": {"height": 800, "width": 1200}, "fonts": {"display": "Georgia", "labels": "Arial"}, "profile": "plum-apricot", "profile_sha256": "c9eaf17798100dfaf4123094d3d3b1e35a319ef81105a348288f919b4d91d8e6", "profile_version": "1.2", "style_version": 1, "theme": "light"}</metadata><defs><style id="brand-style">text { font-family: 'Arial'; font-size: 24px; fill: #231B21; }
.title { font-family: 'Georgia'; font-size: 40px; font-weight: 400; }
.label { font-size: 24px; }
.small { font-size: 20px; fill: #54494F; }
.note { font-size: 21px; }
.section { font-size: 24px; font-weight: 600; fill: #4A2446; }
.node { fill: #FFFFFF; stroke: #665B61; stroke-width: 2; }
.focus { fill: #F1E3EF; stroke: #4A2446; stroke-width: 2.5; }
.highlight { fill: #F2A97A; stroke: #4A2446; stroke-width: 2.5; }
.panel { fill: #4A2446; stroke: #4A2446; stroke-width: 2; }
.on-panel { fill: #FFFFFF; }
.on-highlight { fill: #231B21; }
.badge { fill: #4A2446; }
.number { font-size: 19px; fill: #FFFFFF; }
.arrow { fill: none; stroke: #665B61; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrowhead); }
.leader { fill: none; stroke: #665B61; stroke-width: 2; stroke-dasharray: 6 5; }
.line { fill: none; stroke: #665B61; stroke-width: 2; }
.watermark { font-size: 12px; fill: #54494F; }</style><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#665B61" /></marker></defs><rect id="background" x="0" y="0" width="1200" height="800" fill="#F8F4EF" /><g id="artwork">
  <g id="heading">
    <text x="40" y="60" class="title">Where Trace sits: from model to system intelligence</text>
    <text x="40" y="96" class="small">A loop repeats one agent until a check passes. A graph arranges many runs, and graph engineering optimizes that shape.</text>
  </g>

  <g id="model-intelligence">
    <rect x="40" y="124" width="360" height="470" rx="12" class="node" />
    <rect x="40" y="124" width="360" height="44" rx="12" class="panel" />
    <text x="56" y="154" class="label on-panel">1 Model intelligence</text>
    <text x="56" y="196" class="small">prompt + context engineering</text>
    <rect x="56" y="212" width="328" height="52" rx="10" class="focus" />
    <text x="72" y="245" class="small">Model call: provider.ts</text>
    <rect x="56" y="272" width="328" height="52" rx="10" class="focus" />
    <text x="72" y="305" class="small">Prompt: buildSystemPrompt()</text>
    <rect x="56" y="332" width="328" height="52" rx="10" class="focus" />
    <text x="72" y="365" class="small">Context: compact()</text>
    <rect x="56" y="392" width="328" height="52" rx="10" class="focus" />
    <text x="72" y="425" class="small">AGENTS.md + TRACE.md</text>
  </g>

  <g id="individual-intelligence">
    <rect x="420" y="124" width="360" height="470" rx="12" class="node" />
    <rect x="420" y="124" width="360" height="44" rx="12" class="panel" />
    <text x="436" y="154" class="label on-panel">2 Individual intelligence</text>
    <text x="436" y="196" class="small">harness + loop engineering</text>
    <rect x="436" y="212" width="328" height="52" rx="10" class="focus" />
    <text x="452" y="245" class="small">Tools: tools.ts</text>
    <rect x="436" y="272" width="328" height="52" rx="10" class="focus" />
    <text x="452" y="305" class="small">Memory: TRACE.md, sessions</text>
    <rect x="436" y="332" width="328" height="52" rx="10" class="focus" />
    <text x="452" y="365" class="small">Skills: skills.ts</text>
    <rect x="436" y="392" width="328" height="52" rx="10" class="focus" />
    <text x="452" y="425" class="small">Runtime: harness.ts</text>
    <rect x="436" y="452" width="328" height="52" rx="10" class="node" />
    <text x="452" y="485" class="small">Loop: loop.ts; gate in 5-fleet</text>
    <rect x="436" y="512" width="328" height="52" rx="10" class="highlight" />
    <text x="452" y="545" class="small on-highlight">Feedback: gate.ts, --until</text>
  </g>

  <g id="system-intelligence">
    <rect x="800" y="124" width="360" height="470" rx="12" class="node" />
    <rect x="800" y="124" width="360" height="44" rx="12" class="panel" />
    <text x="816" y="154" class="label on-panel">3 System intelligence</text>
    <text x="816" y="196" class="small">graph engineering</text>
    <rect x="816" y="212" width="328" height="52" rx="10" class="highlight" />
    <text x="832" y="245" class="small on-highlight">Tasks: a task graph</text>
    <rect x="816" y="272" width="328" height="52" rx="10" class="node" />
    <text x="832" y="305" class="small">Agents: spawn_agent, runFleet</text>
    <rect x="816" y="332" width="328" height="52" rx="10" class="node" />
    <text x="832" y="365" class="small">State: sessions, resume()</text>
    <rect x="816" y="392" width="328" height="52" rx="10" class="highlight" />
    <text x="832" y="425" class="small on-highlight">Optimize: rewire the graph</text>
    <rect x="816" y="452" width="328" height="52" rx="10" class="highlight" />
    <text x="832" y="485" class="small on-highlight">Ontology: shared terms</text>
  </g>

  <g id="progression">
    <path d="M400 360 H418" class="arrow" />
    <path d="M780 360 H798" class="arrow" />
  </g>

  <g id="legend">
    <rect x="40" y="618" width="40" height="26" rx="6" class="focus" />
    <text x="92" y="638" class="small">built in Trace</text>
    <rect x="300" y="618" width="40" height="26" rx="6" class="node" />
    <text x="352" y="638" class="small">partly there</text>
    <rect x="540" y="618" width="40" height="26" rx="6" class="highlight" />
    <text x="592" y="638" class="small">next step</text>
  </g>

  <g id="notes">
    <text x="40" y="688" class="small">A loop is the smallest graph: one node with an edge back to itself. demos/5-fleet.ts is a fixed four-node graph.</text>
    <text x="40" y="720" class="small">Optimizing a graph: GPTSwarm and Flow rewire it; LLMCompiler runs independent nodes in parallel.</text>
    <text x="40" y="752" class="small">Levels and categories follow github.com/DEEP-JLU/Awesome-Graph-Engineering.</text>
  </g>
</g><g id="watermark"><text x="1176" y="776" class="watermark" text-anchor="end">Dipesh Walia</text></g></svg>
