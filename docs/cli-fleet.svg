<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">How the CLI and the fleet drive a Harness</title><desc id="desc">trace/cli.ts runs one Harness from a terminal in three forms: interactive, headless with -p, and --resume. trace/fleet.ts runFleet runs one Harness per job in a promise pool and returns results in input order. demos/5-fleet.ts builds, reviews in the same session, verifies, and reviews once more when a check fails.</desc><metadata id="illustration-style">{"canvas": {"height": 800, "width": 1200}, "fonts": {"display": "Georgia", "labels": "Arial"}, "profile": "plum-apricot", "profile_sha256": "c9eaf17798100dfaf4123094d3d3b1e35a319ef81105a348288f919b4d91d8e6", "profile_version": "1.2", "style_version": 1, "theme": "light"}</metadata><defs><style id="brand-style">text { font-family: 'Arial'; font-size: 24px; fill: #231B21; }
.title { font-family: 'Georgia'; font-size: 40px; font-weight: 400; }
.label { font-size: 24px; }
.small { font-size: 20px; fill: #54494F; }
.note { font-size: 21px; }
.section { font-size: 24px; font-weight: 600; fill: #4A2446; }
.node { fill: #FFFFFF; stroke: #665B61; stroke-width: 2; }
.focus { fill: #F1E3EF; stroke: #4A2446; stroke-width: 2.5; }
.highlight { fill: #F2A97A; stroke: #4A2446; stroke-width: 2.5; }
.panel { fill: #4A2446; stroke: #4A2446; stroke-width: 2; }
.on-panel { fill: #FFFFFF; }
.on-highlight { fill: #231B21; }
.badge { fill: #4A2446; }
.number { font-size: 19px; fill: #FFFFFF; }
.arrow { fill: none; stroke: #665B61; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrowhead); }
.leader { fill: none; stroke: #665B61; stroke-width: 2; stroke-dasharray: 6 5; }
.line { fill: none; stroke: #665B61; stroke-width: 2; }
.watermark { font-size: 12px; fill: #54494F; }</style><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#665B61" /></marker></defs><rect id="background" x="0" y="0" width="1200" height="800" fill="#F8F4EF" /><g id="artwork">
  <g id="heading">
    <text x="40" y="60" class="title">How the CLI and the fleet drive a Harness</text>
    <text x="40" y="96" class="small">The CLI runs one Harness from a terminal. runFleet runs one Harness per project, side by side.</text>
  </g>

  <g id="cli-forms">
    <rect x="40" y="124" width="540" height="292" rx="12" class="node" />
    <rect x="40" y="124" width="540" height="44" rx="12" class="panel" />
    <text x="56" y="154" class="label on-panel">bun run trace &#183; three forms</text>

    <rect x="56" y="184" width="508" height="64" rx="10" class="focus" />
    <text x="72" y="213" class="label">bun run trace</text>
    <text x="72" y="238" class="small">prompt loop &#183; safe mode asks before writes</text>

    <rect x="56" y="260" width="508" height="64" rx="10" class="focus" />
    <text x="72" y="289" class="label">bun run trace -p "task"</text>
    <text x="72" y="314" class="small">headless: one task, then exit 0 &#183; yolo mode</text>

    <rect x="56" y="336" width="508" height="64" rx="10" class="focus" />
    <text x="72" y="365" class="label">bun run trace --resume</text>
    <text x="72" y="390" class="small">resume() the latest session, then run</text>
  </g>

  <g id="cli-main">
    <rect x="620" y="124" width="540" height="292" rx="12" class="node" />
    <rect x="620" y="124" width="540" height="44" rx="12" class="panel" />
    <text x="636" y="154" class="label on-panel">main() &#183; one Harness per process</text>

    <g id="main-step-1">
      <rect x="636" y="184" width="508" height="64" rx="10" class="node" />
      <circle cx="664" cy="205" r="12" class="badge" />
      <text x="664" y="212" class="number" text-anchor="middle">1</text>
      <text x="686" y="213" class="label">parseArgs()</text>
      <text x="652" y="238" class="small">-d -m --mode --max-turns; a bad flag exits 2</text>
    </g>

    <g id="main-step-2">
      <rect x="636" y="260" width="508" height="64" rx="10" class="node" />
      <circle cx="664" cy="281" r="12" class="badge" />
      <text x="664" y="288" class="number" text-anchor="middle">2</text>
      <text x="686" y="289" class="label">new Harness()</text>
      <text x="652" y="314" class="small">Policy(mode, approve) and eventPrinter()</text>
    </g>

    <g id="main-step-3">
      <rect x="636" y="336" width="508" height="64" rx="10" class="highlight" />
      <circle cx="664" cy="357" r="12" class="badge" />
      <text x="664" y="364" class="number" text-anchor="middle">3</text>
      <text x="686" y="365" class="label on-highlight">Ctrl-C mid-run</text>
      <text x="652" y="390" class="small on-highlight">exit 130 and print --resume -d &lt;dir&gt;</text>
    </g>

    <path d="M580 270 H618" class="arrow" />
  </g>

  <g id="fleet">
    <text x="40" y="460" class="section">runFleet: one Harness per job, at most maxWorkers at a time</text>

    <rect x="40" y="478" width="208" height="96" rx="12" class="node" />
    <text x="56" y="508" class="label">jobs</text>
    <text x="56" y="536" class="small">name, workdir,</text>
    <text x="56" y="560" class="small">task</text>

    <rect x="268" y="478" width="208" height="96" rx="12" class="node" />
    <text x="284" y="508" class="label">promise pool</text>
    <text x="284" y="536" class="small">maxWorkers = 4</text>
    <text x="284" y="560" class="small">jobs in flight</text>

    <rect x="496" y="478" width="208" height="96" rx="12" class="focus" />
    <text x="512" y="508" class="label">makeHarness()</text>
    <text x="512" y="536" class="small">own workdir,</text>
    <text x="512" y="560" class="small">then run(task)</text>

    <rect x="724" y="478" width="208" height="96" rx="12" class="highlight" />
    <text x="740" y="508" class="label on-highlight">outcome</text>
    <text x="740" y="536" class="small on-highlight">ok: true, answer</text>
    <text x="740" y="560" class="small on-highlight">ok: false, error</text>

    <rect x="952" y="478" width="208" height="96" rx="12" class="node" />
    <text x="968" y="508" class="label">results</text>
    <text x="968" y="536" class="small">in input order,</text>
    <text x="968" y="560" class="small">one per job</text>

    <path d="M248 526 H266" class="arrow" />
    <path d="M476 526 H494" class="arrow" />
    <path d="M704 526 H722" class="arrow" />
    <path d="M932 526 H950" class="arrow" />
  </g>

  <g id="fleet-demo">
    <text x="40" y="618" class="section">demos/5-fleet.ts: two phases per project, then checks</text>

    <rect x="40" y="636" width="260" height="72" rx="12" class="node" />
    <text x="56" y="664" class="label">1 build</text>
    <text x="56" y="692" class="small">fresh folder + skill</text>

    <rect x="320" y="636" width="260" height="72" rx="12" class="focus" />
    <text x="336" y="664" class="label">2 review</text>
    <text x="336" y="692" class="small">resume(), same session</text>

    <rect x="600" y="636" width="260" height="72" rx="12" class="node" />
    <text x="616" y="664" class="label">3 verify</text>
    <text x="616" y="692" class="small">files, greps, bun test</text>

    <rect x="880" y="636" width="260" height="72" rx="12" class="highlight" />
    <text x="896" y="664" class="label on-highlight">4 one more review</text>
    <text x="896" y="692" class="small on-highlight">only if a check fails</text>

    <path d="M300 672 H318" class="arrow" />
    <path d="M580 672 H598" class="arrow" />
    <path d="M860 672 H878" class="arrow" />

    <text x="40" y="748" class="small">Each job keeps its own session file, so when a build stops on an error, the review phase resumes it.</text>
  </g>
</g><g id="watermark"><text x="1176" y="776" class="watermark" text-anchor="end">Dipesh Walia</text></g></svg>
