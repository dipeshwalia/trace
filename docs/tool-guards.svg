<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">How Trace checks a tool call</title><desc id="desc">Deep dive of trace/security.ts and trace/tools.ts: Policy.check decides whether a call runs, resolve() confines file tool paths, and a macOS sandbox confines bash. The six core tools and their limits are listed below.</desc><metadata id="illustration-style">{"canvas": {"height": 800, "width": 1200}, "fonts": {"display": "Georgia", "labels": "Arial"}, "profile": "plum-apricot", "profile_sha256": "c9eaf17798100dfaf4123094d3d3b1e35a319ef81105a348288f919b4d91d8e6", "profile_version": "1.2", "style_version": 1, "theme": "light"}</metadata><defs><style id="brand-style">text { font-family: 'Arial'; font-size: 24px; fill: #231B21; }
.title { font-family: 'Georgia'; font-size: 40px; font-weight: 400; }
.label { font-size: 24px; }
.small { font-size: 20px; fill: #54494F; }
.note { font-size: 21px; }
.section { font-size: 24px; font-weight: 600; fill: #4A2446; }
.node { fill: #FFFFFF; stroke: #665B61; stroke-width: 2; }
.focus { fill: #F1E3EF; stroke: #4A2446; stroke-width: 2.5; }
.highlight { fill: #F2A97A; stroke: #4A2446; stroke-width: 2.5; }
.panel { fill: #4A2446; stroke: #4A2446; stroke-width: 2; }
.on-panel { fill: #FFFFFF; }
.on-highlight { fill: #231B21; }
.badge { fill: #4A2446; }
.number { font-size: 19px; fill: #FFFFFF; }
.arrow { fill: none; stroke: #665B61; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrowhead); }
.leader { fill: none; stroke: #665B61; stroke-width: 2; stroke-dasharray: 6 5; }
.line { fill: none; stroke: #665B61; stroke-width: 2; }
.watermark { font-size: 12px; fill: #54494F; }</style><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#665B61" /></marker></defs><rect id="background" x="0" y="0" width="1200" height="800" fill="#F8F4EF" /><g id="artwork">
  <g id="heading">
    <text x="40" y="60" class="title">How Trace checks a tool call</text>
    <text x="40" y="96" class="small">Every call meets the policy first. If allowed, file tools pass through resolve(), and bash runs in a sandbox.</text>
  </g>

  <g id="policy">
    <rect x="40" y="120" width="346" height="460" rx="12" class="node" />
    <rect x="40" y="120" width="346" height="44" rx="12" class="panel" />
    <text x="56" y="150" class="label on-panel">1 · Policy.check</text>
    <text x="56" y="194" class="small">security.ts · first match wins</text>

    <g id="policy-rules">
      <text x="56" y="232" class="small">bash on deny list</text>
      <rect x="264" y="212" width="110" height="28" rx="8" class="highlight" />
      <text x="319" y="232" class="small on-highlight" text-anchor="middle">BLOCKED</text>

      <text x="56" y="266" class="small">a read tool</text>
      <rect x="264" y="246" width="110" height="28" rx="8" class="focus" />
      <text x="319" y="266" class="small" text-anchor="middle">allow</text>

      <text x="56" y="300" class="small">mode is yolo</text>
      <rect x="264" y="280" width="110" height="28" rx="8" class="focus" />
      <text x="319" y="300" class="small" text-anchor="middle">allow</text>

      <text x="56" y="334" class="small">mode is read-only</text>
      <rect x="264" y="314" width="110" height="28" rx="8" class="highlight" />
      <text x="319" y="334" class="small on-highlight" text-anchor="middle">BLOCKED</text>

      <text x="56" y="368" class="small">safe, approver yes</text>
      <rect x="264" y="348" width="110" height="28" rx="8" class="focus" />
      <text x="319" y="368" class="small" text-anchor="middle">allow</text>

      <text x="56" y="402" class="small">safe, otherwise</text>
      <rect x="264" y="382" width="110" height="28" rx="8" class="highlight" />
      <text x="319" y="402" class="small on-highlight" text-anchor="middle">BLOCKED</text>
    </g>

    <path d="M56 422 H370" class="line" />
    <g id="deny-list">
      <text x="56" y="450" class="section">Deny list, every mode</text>
      <text x="56" y="478" class="small">rm -rf on /, ~, $HOME, home</text>
      <text x="56" y="504" class="small">sudo · mkfs · dd if=</text>
      <text x="56" y="530" class="small">curl or wget piped to a shell</text>
      <text x="56" y="556" class="small">git push -f · &gt; /dev/sd*</text>
    </g>
  </g>

  <g id="resolve">
    <rect x="427" y="120" width="346" height="460" rx="12" class="node" />
    <rect x="427" y="120" width="346" height="44" rx="12" class="panel" />
    <text x="443" y="150" class="label on-panel">2a · resolve(path)</text>
    <text x="443" y="194" class="small">file tools · tools.ts</text>

    <g id="resolve-steps">
      <circle cx="455" cy="225" r="12" class="badge" />
      <text x="455" y="232" class="number" text-anchor="middle">1</text>
      <text x="477" y="232" class="small">join path onto workdir</text>
      <circle cx="455" cy="259" r="12" class="badge" />
      <text x="455" y="266" class="number" text-anchor="middle">2</text>
      <text x="477" y="266" class="small">realpath the part that exists</text>
      <circle cx="455" cy="293" r="12" class="badge" />
      <text x="455" y="300" class="number" text-anchor="middle">3</text>
      <text x="477" y="300" class="small">re-attach the missing tail</text>
      <circle cx="455" cy="327" r="12" class="badge" />
      <text x="455" y="334" class="number" text-anchor="middle">4</text>
      <text x="477" y="334" class="small">inside workdir: use it</text>
      <circle cx="455" cy="361" r="12" class="badge" />
      <text x="455" y="368" class="number" text-anchor="middle">5</text>
      <text x="477" y="368" class="small">outside: PermissionError</text>
    </g>

    <path d="M443 422 H757" class="line" />
    <g id="resolve-examples">
      <text x="443" y="450" class="section">Examples</text>
      <text x="443" y="478" class="small">src/a.ts → allowed</text>
      <text x="443" y="504" class="small">../README.md → PermissionError</text>
      <text x="443" y="530" class="small">/etc/passwd → PermissionError</text>
      <text x="443" y="556" class="small">symlink to /etc → PermissionError</text>
    </g>
  </g>

  <g id="sandbox">
    <rect x="814" y="120" width="346" height="460" rx="12" class="node" />
    <rect x="814" y="120" width="346" height="44" rx="12" class="panel" />
    <text x="830" y="150" class="label on-panel">2b · bash sandbox</text>
    <text x="830" y="194" class="small">macOS sandbox-exec · tools.ts</text>

    <g id="sandbox-rules">
      <text x="830" y="232" class="small">allow everything by default</text>
      <text x="830" y="266" class="small">deny reads under home</text>
      <text x="830" y="300" class="small">… except workdir, Bun install</text>
      <text x="830" y="334" class="small">deny all writes</text>
      <text x="830" y="368" class="small">… except workdir and /dev</text>
      <text x="830" y="402" class="small">later rules win</text>
    </g>

    <path d="M830 422 H1144" class="line" />
    <g id="sandbox-process">
      <text x="830" y="450" class="section">The bash process</text>
      <text x="830" y="478" class="small">API keys removed from env</text>
      <text x="830" y="504" class="small">empty global git config</text>
      <text x="830" y="530" class="small">timeout kills its process group</text>
      <text x="830" y="556" class="small">other platforms: unconfined</text>
    </g>
  </g>

  <g id="core-tools">
    <text x="40" y="616" class="section">The six tools from coreTools(workdir)</text>

    <rect x="40" y="630" width="360" height="62" rx="12" class="node" />
    <text x="56" y="656" class="label">read_file</text>
    <text x="384" y="656" class="small" text-anchor="end">via 2a</text>
    <text x="56" y="682" class="small">numbered lines, first 4000</text>

    <rect x="420" y="630" width="360" height="62" rx="12" class="node" />
    <text x="436" y="656" class="label">write_file</text>
    <text x="764" y="656" class="small" text-anchor="end">via 2a</text>
    <text x="436" y="682" class="small">creates parent folders</text>

    <rect x="800" y="630" width="360" height="62" rx="12" class="node" />
    <text x="816" y="656" class="label">edit_file</text>
    <text x="1144" y="656" class="small" text-anchor="end">via 2a</text>
    <text x="816" y="682" class="small">snippet must match once</text>

    <rect x="40" y="700" width="360" height="62" rx="12" class="node" />
    <text x="56" y="726" class="label">bash</text>
    <text x="384" y="726" class="small" text-anchor="end">via 2b</text>
    <text x="56" y="752" class="small">120 s timeout, 12,000 chars</text>

    <rect x="420" y="700" width="360" height="62" rx="12" class="node" />
    <text x="436" y="726" class="label">list_files</text>
    <text x="764" y="726" class="small" text-anchor="end">walks workdir</text>
    <text x="436" y="752" class="small">glob match, 500 entries max</text>

    <rect x="800" y="700" width="360" height="62" rx="12" class="node" />
    <text x="816" y="726" class="label">grep</text>
    <text x="1144" y="726" class="small" text-anchor="end">walks workdir</text>
    <text x="816" y="752" class="small">regex, 200 hits, skips binary</text>
  </g>
</g><g id="watermark"><text x="1176" y="776" class="watermark" text-anchor="end">Dipesh Walia</text></g></svg>
